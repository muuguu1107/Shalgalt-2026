<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Шалгалт өгөх</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f3f6fb;
      color: #243247;
      padding-bottom: 40px;
    }
    .exam-header {
      padding: 28px 0 18px;
    }
    .question-card {
      border: 1px solid #e8edf5;
      border-radius: 16px;
      box-shadow: 0 5px 18px #20305008;
      margin-bottom: 18px;
    }
    .option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 13px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      margin-top: 10px;
      cursor: pointer;
      transition: .15s;
    }
    .option:hover {
      border-color: #6d91e8;
      background: #f5f8ff;
    }
    .option:has(input:checked) {
      background: #edf3ff;
      border-color: #2459c4;
    }
    .option input { margin-top: 5px; }
    .timer-box {
      position: fixed;
      top: 14px;
      right: 16px;
      z-index: 1050;
      background: #172b4d;
      color: white;
      border-radius: 13px;
      padding: 10px 16px;
      box-shadow: 0 5px 20px #0002;
      min-width: 125px;
      text-align: center;
    }
    .timer-number {
      font-size: 23px;
      line-height: 1.2;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .timer-warning { background: #b42318; }
    .submit-area {
      position: sticky;
      bottom: 0;
      padding: 16px 0;
      background: #f3f6fbef;
      backdrop-filter: blur(8px);
    }
    @media (max-width: 500px) {
      .timer-box { top: 8px; right: 8px; padding: 8px 10px; }
      .timer-number { font-size: 19px; }
      .exam-header { padding-top: 80px; }
    }
  </style>
</head>
<body>
  <div class="timer-box" id="timerBox" aria-live="polite">
    <div class="small">ҮЛДСЭН ХУГАЦАА</div>
    <div class="timer-number" id="timer">10:00</div>
  </div>

  <main class="container" style="max-width: 900px">
    <header class="exam-header">
      <div class="badge text-bg-primary mb-2">
        {{ exam_data.exam_type }}
      </div>
      <h1 class="h3 fw-bold">Шалгалт</h1>
      <p class="text-secondary mb-1">
        {{ exam_data.name }} · {{ exam_data.position }}
      </p>
      <p class="text-secondary small">
        Нийт {{ total }} асуулт. Асуулт бүрээс нэг хариулт сонгоно уу.
      </p>
    </header>

    <form method="POST" id="examForm" autocomplete="off">
      {% for q in exam_data.questions %}
        <section class="card question-card">
          <div class="card-body p-3 p-md-4">
            <div class="d-flex gap-3 align-items-start">
              <span class="badge rounded-pill text-bg-light border fs-6">
                {{ loop.index }}
              </span>
              <h2 class="h6 fw-bold pt-1 mb-2"
                  style="white-space: pre-line">{{ q.text }}</h2>
            </div>

            <div class="mt-2">
              {% for option in q.options %}
                <label class="option">
                  <input class="form-check-input"
                         type="radio"
                         name="q_{{ q.id }}"
                         value="{{ option.key }}">
                  <span>
                    <strong>{{ option.key }}.</strong>
                    {{ option.text }}
                  </span>
                </label>
              {% endfor %}
            </div>
          </div>
        </section>
      {% endfor %}

      <div class="submit-area">
        <button type="submit" class="btn btn-primary btn-lg text-white w-100"
                id="submitBtn">
          Шалгалт дуусгах, илгээх
        </button>
      </div>
    </form>
  </main>

  <script>
    // Серверээс ирсэн хугацааг ашиглана.
    let remaining = {{ remaining | int }};
    const timer = document.getElementById("timer");
    const timerBox = document.getElementById("timerBox");
    const form = document.getElementById("examForm");
    let submitted = false;

    function updateTimer() {
      const mins = Math.floor(remaining / 60);
      const secs = remaining % 60;

      timer.textContent =
        String(mins).padStart(2, "0") + ":" +
        String(secs).padStart(2, "0");

      if (remaining <= 60) {
        timerBox.classList.add("timer-warning");
      }

      if (remaining <= 0) {
        if (!submitted) {
          submitted = true;
          timer.textContent = "00:00";
          form.requestSubmit();
        }
        return;
      }

      remaining -= 1;
    }

    form.addEventListener("submit", function(event) {
      if (submitted) return;
      submitted = true;

      const button = document.getElementById("submitBtn");
      button.disabled = true;
      button.textContent = "Илгээж байна...";
    });

    updateTimer();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
