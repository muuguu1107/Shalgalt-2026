<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Шалгалтын үр дүн</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f3f6fb;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .result-card {
      width: min(100% - 30px, 520px);
      border: 0;
      border-radius: 22px;
      box-shadow: 0 12px 40px #22314a12;
    }
    .score {
      font-size: 58px;
      line-height: 1.2;
      font-weight: 800;
      color: #244f9e;
    }
  </style>
</head>
<body>
  <main class="card result-card">
    <div class="card-body p-4 p-md-5 text-center">
      {% if result.status == "ТЭНЦСЭН" %}
        <div class="display-4 mb-3">✓</div>
        <span class="badge text-bg-success mb-3">ТЭНЦСЭН</span>
      {% else %}
        <div class="display-4 mb-3">!</div>
        <span class="badge text-bg-danger mb-3">ТЭНЦЭЭГҮЙ</span>
      {% endif %}

      <h1 class="h3 fw-bold mb-2">Шалгалтын үр дүн</h1>
      <p class="text-secondary">{{ result.name }}</p>

      <div class="score my-4">
        {{ result.score }}<span class="fs-3 text-secondary">/{{ result.total }}</span>
      </div>

      <div class="progress mb-3" style="height: 12px">
        <div class="progress-bar {% if result.status == 'ТЭНЦСЭН' %}bg-success{% else %}bg-danger{% endif %}"
             style="width: {{ result.percent }}%"></div>
      </div>

      <p class="fs-5 fw-semibold">{{ result.percent }}%</p>
      <p class="text-secondary">
        Шалгалтын төрөл: {{ result.exam_type }}
      </p>
      <p class="text-secondary small">
        Тэнцэх босго: 8 зөв хариулт
      </p>

      <a href="{{ url_for('index') }}" class="btn btn-primary text-white w-100 mt-3">
        Нүүр хуудас
      </a>
    </div>
  </main>
</body>
</html>
